name: Test

# Chạy khi mở hoặc cập nhật PR vào develop/main, và khi bấm tay (Actions > Test > Run workflow).
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

env:
  # Mật khẩu chỉ dùng cho tài khoản thử trong DB tạm của runner, không phải bí mật thật.
  CI_DB_PASSWORD: ci-root-password
  CI_VNPAY_SECRET: ci-fake-vnpay-secret
  MANAGER_PASSWORD: SeleniumManager@123
  ADMIN_PASSWORD: SeleniumAdmin@123

jobs:
  unit:
    name: Unit test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Không đặt selenium.baseUrl nên các test Selenium tự bỏ qua.
      - run: mvn -B -ntp test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-reports
          path: backend/target/surefire-reports

  selenium:
    name: Selenium
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Start MariaDB
        run: |
          docker run -d --name mariadb -p 3306:3306 \
            -e MARIADB_ROOT_PASSWORD="$CI_DB_PASSWORD" \
            mariadb:11 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
          for i in $(seq 1 60); do
            docker exec mariadb mariadb -uroot -p"$CI_DB_PASSWORD" -e 'select 1' >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "MariaDB did not start" && docker logs mariadb && exit 1

      - name: Load schema and seed data
        run: docker exec -i mariadb mariadb -uroot -p"$CI_DB_PASSWORD" < database/setup_ebike_database.sql

      - name: Create test-only manager and admin accounts
        run: |
          sudo apt-get install -y -qq apache2-utils
          hash() { htpasswd -bnBC 10 "" "$1" | tr -d ':\n' | sed 's/^\$2y/$2a/'; }
          cat > "$RUNNER_TEMP/ci-accounts.sql" <<SQL
          USE ebike_db;
          INSERT INTO users(username,email,password_hash,first_name,last_name,is_active,is_verified,email_verified_at) VALUES
          ('selenium.manager','selenium.manager@example.com','$(hash "$MANAGER_PASSWORD")','Selenium','Manager',1,1,NOW()),
          ('selenium.admin','selenium.admin@example.com','$(hash "$ADMIN_PASSWORD")','Selenium','Admin',1,1,NOW());
          INSERT INTO user_roles(user_id,role_id) SELECT u.id,r.id FROM users u JOIN roles r
            ON r.name=IF(u.username='selenium.admin','ADMIN','MANAGER')
            WHERE u.username IN ('selenium.manager','selenium.admin');
          SQL
          docker exec -i mariadb mariadb -uroot -p"$CI_DB_PASSWORD" < "$RUNNER_TEMP/ci-accounts.sql"

      - name: Build the app
        run: mvn -B -ntp -DskipTests package

      - name: Start the app
        env:
          SPRING_DATASOURCE_PASSWORD: ${{ env.CI_DB_PASSWORD }}
          APP_RATE_LIMIT_ENABLED: 'false'
          VNPAY_TMN_CODE: CITEST01
          VNPAY_HASH_SECRET: ${{ env.CI_VNPAY_SECRET }}
          GEMINI_AI_KEY: ${{ secrets.GEMINI_AI_KEY }}
        run: |
          nohup java -jar target/ebike-backend-1.0.0.jar > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 90); do
            curl -fs -o /dev/null http://localhost:8080/ && exit 0
            sleep 2
          done
          echo "App did not start"; tail -n 100 "$RUNNER_TEMP/app.log"; exit 1

      - name: Run Selenium tests
        env:
          HAS_GEMINI: ${{ secrets.GEMINI_AI_KEY != '' }}
        run: |
          # Test chatbot cần khóa Gemini thật: bỏ qua nếu repo chưa có secret GEMINI_AI_KEY.
          EXCLUDE=""
          if [ "$HAS_GEMINI" != "true" ]; then EXCLUDE="-Dtest=!ChatbotMemorySeleniumTest"; fi
          mvn -B -ntp test -Dgroups=selenium $EXCLUDE \
            -Dselenium.baseUrl=http://localhost:8080 \
            -Dselenium.vnpayHashSecret="$CI_VNPAY_SECRET" \
            -Dselenium.managerUser=selenium.manager -Dselenium.managerPassword="$MANAGER_PASSWORD" \
            -Dselenium.adminUser=selenium.admin -Dselenium.adminPassword="$ADMIN_PASSWORD"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-reports
          path: |
            backend/target/surefire-reports
            backend/target/selenium
            ${{ runner.temp }}/app.log
          if-no-files-found: ignore
