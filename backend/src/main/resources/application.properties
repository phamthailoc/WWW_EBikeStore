spring.application.name=ebike-backend
spring.profiles.default=dev

server.port=8080
server.servlet.context-path=

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/ebike_db?useUnicode=true&characterEncoding=utf8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate

# JWT Configuration
jwt.secret=${APP_JWT_SECRET:your-super-secret-jwt-key-change-this-in-production-with-a-secure-random-key-at-least-32-characters}
jwt.expiration=${APP_JWT_EXPIRATION:86400000}

# Auth cookie configuration
app.auth.cookie.secure=${APP_AUTH_COOKIE_SECURE:false}
app.auth.cookie.same-site=${APP_AUTH_COOKIE_SAME_SITE:Lax}
app.rate-limit.enabled=${APP_RATE_LIMIT_ENABLED:true}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Product lists and details are cached in this JVM's memory and evicted when stock, photos, reviews or orders change.
spring.cache.type=simple

app.storage.s3.bucket=${APP_STORAGE_S3_BUCKET:kinetic-s3-bucket}
app.storage.s3.region=${APP_STORAGE_S3_REGION:ap-southeast-1}
app.storage.s3.public-base-url=${APP_STORAGE_S3_PUBLIC_BASE_URL:}
app.storage.s3.product-image-prefix=${APP_STORAGE_S3_PRODUCT_IMAGE_PREFIX:products}

vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/payment/return}
vnpay.ipn-url=${VNPAY_IPN_URL:http://localhost:8080/api/v1/payments/vnpay/ipn}

# Unpaid orders hold stock only this long, then are cancelled automatically
# Page language (V19): messages.properties is Vietnamese, messages_en.properties English; a missing English key shows the Vietnamese text.
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
app.order.vnpay-expiry=${APP_ORDER_VNPAY_EXPIRY:PT30M}
app.order.pay-later-expiry=${APP_ORDER_PAY_LATER_EXPIRY:PT72H}
# How long the store keeps a bike for a customer after telling them it is ready; only then may staff cancel the order.
app.order.pickup-hold=${APP_ORDER_PICKUP_HOLD:P7D}
app.order.expiry-check-interval=${APP_ORDER_EXPIRY_CHECK_INTERVAL:PT5M}

app.order.email-otp.mail-enabled=${ORDER_EMAIL_OTP_MAIL_ENABLED:true}
app.order.email-otp.required=${ORDER_EMAIL_OTP_REQUIRED:false}
app.order.email-otp.from=${ORDER_EMAIL_OTP_FROM:no-reply@ebike.local}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}

app.ai.gemini.enabled=${GEMINI_AI_ENABLED:true}
app.ai.gemini.api-key=${GEMINI_AI_KEY:}
app.ai.gemini.model=${GEMINI_AI_MODEL:gemini-3.1-flash-lite}
app.ai.gemini.fallback-models=${GEMINI_AI_FALLBACK_MODELS:gemini-flash-lite-latest}
app.ai.gemini.connect-timeout-ms=${GEMINI_CONNECT_TIMEOUT_MS:3000}
app.ai.gemini.read-timeout-ms=${GEMINI_READ_TIMEOUT_MS:7000}
app.ai.gemini.max-attempts=${GEMINI_MAX_ATTEMPTS:3}
app.ai.gemini.retry-delay-ms=${GEMINI_RETRY_DELAY_MS:3000}
app.ai.pdf-knowledge.enabled=${PDF_KNOWLEDGE_ENABLED:true}
app.ai.pdf-knowledge.location-pattern=${PDF_KNOWLEDGE_LOCATION_PATTERN:classpath*:docs/*.pdf}
app.ai.pdf-knowledge.max-results=${PDF_KNOWLEDGE_MAX_RESULTS:3}
app.ai.pdf-knowledge.chunk-size=${PDF_KNOWLEDGE_CHUNK_SIZE:900}
app.ai.pdf-knowledge.chunk-overlap=${PDF_KNOWLEDGE_CHUNK_OVERLAP:120}
app.ai.pdf-knowledge.min-score=${PDF_KNOWLEDGE_MIN_SCORE:2.0}
