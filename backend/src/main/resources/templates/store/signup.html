<!doctype html><html th:lang="${#locale.language}" lang="vi" xmlns:th="http://www.thymeleaf.org" th:attr="data-theme=${userTheme},data-theme-user=${userTheme != null ? 'true' : null}"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="/css/theme.css?v=20261109-theme2-ui"><script src="/js/theme.js?v=20261124-walk"></script><title th:text="#{signup.title}">Tạo tài khoản | KINETIC</title><link rel="stylesheet" th:href="@{/css/store.css(v=20261109-theme1-ui)}"><link rel="stylesheet" href="/css/commerce.css?v=20261121-v22b-ui"><script src="/js/return-to.js?v=20261124-walk"></script><script src="/js/cart.js?v=20261124-walk"></script><link rel="stylesheet" href="/css/taste.css?v=20261126"></head><body><a class="skip-link" href="#main">Bỏ qua điều hướng</a><header class="top"><a class="brand" th:href="@{/}"><span>K</span> KINETIC</a><a th:href="@{/shop}"><th:block th:text="#{common.backToStore}">Quay lại cửa hàng</th:block></a></header><main class="auth" id="main"><h1><th:block th:text="#{signup.heading}">Tạo tài khoản.</th:block></h1><p><th:block th:text="#{signup.sub}">Đăng ký để bắt đầu hành trình cùng KINETIC.</th:block></p><form id="signupForm"><label><th:block th:text="#{signup.lastName}">Họ</th:block><input name="firstName" autocomplete="given-name" required></label><label><th:block th:text="#{signup.firstName}">Tên</th:block><input name="lastName" autocomplete="family-name" required></label><label><th:block th:text="#{auth.username}">Tên đăng nhập</th:block><input name="username" autocomplete="username" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label><th:block th:text="#{auth.password}">Mật khẩu</th:block><input name="password" type="password" autocomplete="new-password" minlength="8" required></label><label class="check-line"><input type="checkbox" id="showPw"> <th:block th:text="#{auth.showPassword}">Hiện mật khẩu</th:block></label><button class="button"><th:block th:text="#{signup.submit}">Tạo tài khoản</th:block> <i class="ph ph-arrow-up-right" aria-hidden="true"></i></button><p id="error" class="error" role="alert"></p></form><p><th:block th:text="#{signup.haveAccount}">Đã có tài khoản?</th:block> <a th:href="@{/login}"><th:block th:text="#{login.submit}">Đăng nhập</th:block></a></p></main><script>
document.getElementById('signupForm').addEventListener('submit', async e => { e.preventDefault(); const btn=e.currentTarget.querySelector('button.button'); btn.disabled=true; const data=Object.fromEntries(new FormData(e.currentTarget)); try { const r=await fetch('/api/v1/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}); if(!r.ok) { const body=await r.json().catch(()=>({})); throw new Error(body.message||'Không thể tạo tài khoản.'); } const wanted=safeReturnTo(new URLSearchParams(location.search).get('returnTo')); location.href=wanted?'/login?registered=1&returnTo='+encodeURIComponent(wanted):'/login?registered=1'; } catch(err) { document.getElementById('error').textContent=err.message; btn.disabled=false; } });
const back=safeReturnTo(new URLSearchParams(location.search).get('returnTo')); if(back) document.querySelectorAll('a[href$="/login"]').forEach(a=>{a.href='/login?returnTo='+encodeURIComponent(back);});
document.getElementById('showPw').addEventListener('change',e=>{document.querySelector('input[name=password]').type=e.target.checked?'text':'password'});</script></body></html>
