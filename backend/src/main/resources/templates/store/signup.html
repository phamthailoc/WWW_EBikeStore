<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tạo tài khoản | KINETIC</title><link rel="stylesheet" th:href="@{/css/store.css(v=20261031)}"><link rel="stylesheet" href="/css/commerce.css?v=20261102-cart1"><script src="/js/cart.js?v=20261102-cart1"></script></head><body><header class="top"><a class="brand" th:href="@{/}"><span>K</span> KINETIC</a><a th:href="@{/shop}">Quay lại cửa hàng</a></header><main class="auth"><p class="eyebrow">JOIN THE MOVEMENT</p><h1>Tạo tài khoản.</h1><p>Đăng ký để bắt đầu hành trình cùng KINETIC.</p><form id="signupForm"><label>Họ<input name="firstName" autocomplete="given-name" required></label><label>Tên<input name="lastName" autocomplete="family-name" required></label><label>Tên đăng nhập<input name="username" autocomplete="username" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Mật khẩu<input name="password" type="password" autocomplete="new-password" minlength="8" required></label><button class="button">Tạo tài khoản <b>↗</b></button><p id="error" class="error"></p></form><p>Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a></p></main><script>
document.getElementById('signupForm').addEventListener('submit', async e => { e.preventDefault(); const data=Object.fromEntries(new FormData(e.currentTarget)); try { const r=await fetch('/api/v1/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}); if(!r.ok) { const body=await r.json().catch(()=>({})); throw new Error(body.message||'Không thể tạo tài khoản.'); } location.href='/login'; } catch(err) { document.getElementById('error').textContent=err.message; } });
</script></body></html>
