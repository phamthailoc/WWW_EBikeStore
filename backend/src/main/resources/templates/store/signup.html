<!doctype html><html th:lang="${#locale.language}" lang="vi" xmlns:th="http://www.thymeleaf.org" th:attr="data-theme=${userTheme},data-theme-user=${userTheme != null ? 'true' : null}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="/css/theme.css?v=20261109-theme2"><script src="/js/theme.js?v=20261109-theme4"></script><script th:inline="javascript">window.I18N=/*[[${jsMessages}]]*/ {};</script><script src="/js/i18n.js?v=20261110-i18n1"></script><title th:text="#{signup.title}">Tạo tài khoản | KINETIC</title><link rel="stylesheet" th:href="@{/css/store.css(v=20261109-theme1)}"><link rel="stylesheet" href="/css/commerce.css?v=20261109-theme1"><script src="/js/cart.js?v=20261110-i18n2"></script></head><body><header class="top"><a class="brand" th:href="@{/}"><span>K</span> KINETIC</a><a th:href="@{/shop}"><th:block th:text="#{common.backToStore}">Quay lại cửa hàng</th:block></a></header><main class="auth"><p class="eyebrow">JOIN THE MOVEMENT</p><h1><th:block th:text="#{signup.heading}">Tạo tài khoản.</th:block></h1><p><th:block th:text="#{signup.sub}">Đăng ký để bắt đầu hành trình cùng KINETIC.</th:block></p><form id="signupForm"><label><th:block th:text="#{signup.lastName}">Họ</th:block><input name="firstName" autocomplete="given-name" required></label><label><th:block th:text="#{signup.firstName}">Tên</th:block><input name="lastName" autocomplete="family-name" required></label><label><th:block th:text="#{auth.username}">Tên đăng nhập</th:block><input name="username" autocomplete="username" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label><th:block th:text="#{auth.password}">Mật khẩu</th:block><input name="password" type="password" autocomplete="new-password" minlength="8" required></label><button class="button"><th:block th:text="#{signup.submit}">Tạo tài khoản</th:block> <b>↗</b></button><p id="error" class="error"></p></form><p><th:block th:text="#{signup.haveAccount}">Đã có tài khoản?</th:block> <a th:href="@{/login}"><th:block th:text="#{login.submit}">Đăng nhập</th:block></a></p></main><script>
document.getElementById('signupForm').addEventListener('submit', async e => { e.preventDefault(); const data=Object.fromEntries(new FormData(e.currentTarget)); try { const r=await fetch('/api/v1/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}); if(!r.ok) { const body=await r.json().catch(()=>({})); throw new Error(body.message||t('js.signup.failed')); } location.href='/login'; } catch(err) { document.getElementById('error').textContent=err.message; } });
</script></body></html>
