<!doctype html>
<html th:lang="${#locale.language}" lang="vi" xmlns:th="http://www.thymeleaf.org" th:attr="data-theme=${userTheme},data-theme-user=${userTheme != null ? 'true' : null}">
<head>
  <meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="/css/theme.css?v=20261109-theme2"><script src="/js/theme.js?v=20261124-walk"></script>
  <title th:text="#{login.title}">Đăng nhập | KINETIC</title><link rel="stylesheet" th:href="@{/css/store.css(v=20261109-theme1)}">
  <link rel="stylesheet" th:href="@{/css/workspace.css(v=20261109-theme1)}">
<link rel="stylesheet" th:href="@{/css/workspace-overrides.css(v=20261124-polish)}"><link rel="stylesheet" href="/css/commerce.css?v=20261121-v22b"><script src="/js/return-to.js?v=20261124-walk"></script><script src="/js/cart.js?v=20261124-walk"></script><link rel="stylesheet" href="/css/taste.css?v=20261125"></head>
<body><a class="skip-link" href="#main">Bỏ qua điều hướng</a>
<header class="top"><a class="brand" th:href="@{/}"><span>K</span> KINETIC</a><div class="auth-links"><span><th:block th:text="#{login.noAccount}">Chưa có tài khoản?</th:block></span><a class="register-link" th:href="@{/signup}"><th:block th:text="#{login.signupNow}">Đăng ký ngay <i class="ph ph-arrow-up-right" aria-hidden="true"></i></th:block></a><a th:href="@{/shop}"><th:block th:text="#{common.backToStore}">Quay lại cửa hàng</th:block></a></div></header>
<main class="auth" id="main"><h1><th:block th:text="#{login.heading}">Đăng nhập.</th:block></h1><p><th:block th:text="#{login.sub}">Tiếp tục hành trình cùng KINETIC.</th:block></p>
  <form id="loginForm"><label><th:block th:text="#{login.identity}">Email hoặc tên đăng nhập</th:block><input name="usernameOrEmail" type="text" autocomplete="username" required></label><label><th:block th:text="#{auth.password}">Mật khẩu</th:block><input name="password" type="password" autocomplete="current-password" required></label><label class="check-line"><input type="checkbox" id="showPw"> <th:block th:text="#{auth.showPassword}">Hiện mật khẩu</th:block></label><button class="button"><th:block th:text="#{login.submit}">Đăng nhập</th:block> <i class="ph ph-arrow-up-right" aria-hidden="true"></i></button><p id="error" class="error" role="alert"></p></form>
  <p class="auth-register"><th:block th:text="#{login.noAccount}">Chưa có tài khoản?</th:block> <a th:href="@{/signup}"><th:block th:text="#{login.createLink}">Tạo tài khoản KINETIC</th:block></a></p>
</main>
<script>
document.getElementById('loginForm').addEventListener('submit', async e => { e.preventDefault(); const btn=e.currentTarget.querySelector('button.button'); btn.disabled=true; const data=Object.fromEntries(new FormData(e.currentTarget)); try { const r=await fetch('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}); if(r.status===429) throw new Error('Bạn đã thử đăng nhập quá nhiều lần. Vui lòng đợi một phút rồi thử lại.'); if(!r.ok) throw new Error('Tên đăng nhập hoặc mật khẩu chưa chính xác.'); const user=await r.json(); const roles=user.roles||[]; const wanted=safeReturnTo(new URLSearchParams(location.search).get('returnTo')); location.href=wanted?wanted:roles.includes('ADMIN')?'/admin':roles.includes('MANAGER')?'/manager':roles.includes('CUSTOMER')?'/customer':'/'; } catch(err) { document.getElementById('error').textContent=err.message; btn.disabled=false; } });
// a visitor who came to book a test ride (or anything else that needs an account) and signs up instead keeps the way back
const back=safeReturnTo(new URLSearchParams(location.search).get('returnTo')); if(back) document.querySelectorAll('a[href$="/signup"]').forEach(a=>{a.href='/signup?returnTo='+encodeURIComponent(back);});
document.getElementById('showPw').addEventListener('change',e=>{document.querySelector('input[name=password]').type=e.target.checked?'text':'password'});</script>
</body></html>
