<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${product.name} + ' | KINETIC'">KINETIC</title><link rel="stylesheet" th:href="@{/css/store.css(v=20261031)}"><link rel="stylesheet" th:href="@{/css/workspace.css(v=20261031)}"><link rel="stylesheet" th:href="@{/css/workspace-overrides.css(v=20261031)}"></head>
<body><header class="top"><a class="brand" th:href="@{/}"><span>K</span> KINETIC</a><nav><a th:href="@{/products}">Bộ sưu tập</a><a th:href="@{/support}">Hỗ trợ</a></nav><a class="login" th:href="@{/login}">Đăng nhập ↗</a></header>
<main class="detail" id="productPage" th:attr="data-id=${product.id},data-name=${product.name},data-price=${product.discountPrice != null ? product.discountPrice : product.price},data-slug=${product.slug},data-image=${!product.images.empty ? product.images[0] : '/images/hero-fallback.svg'}"><a class="back" th:href="@{/products}">← Tất cả sản phẩm</a><div class="detail-grid"><div class="detail-photo"><img id="productImage" th:src="${!product.images.empty ? product.images[0] : '/images/hero-fallback.svg'}" th:alt="${product.name}"></div>
<div class="detail-copy"><p class="eyebrow" th:text="${product.category.name}">XE ĐIỆN</p><h1 th:text="${product.name}">KINETIC</h1><div class="detail-price" id="productPrice" th:attr="data-price=${product.discountPrice != null ? product.discountPrice : product.price}" th:text="${#numbers.formatDecimal(product.discountPrice != null ? product.discountPrice : product.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</div><p class="lead" th:text="${product.description}">Mô tả sản phẩm.</p>
<section class="variant-picker" th:if="${product.variants != null and !product.variants.empty}"><p class="variant-title">Chọn màu xe <span id="selectedColor" th:text="${product.variants[0].colorName}">Màu</span></p><div class="variant-options"><button th:each="variant,stat : ${product.variants}" type="button" class="variant-option" th:classappend="${stat.first ? ' selected' : ''}" th:attr="data-variant-id=${variant.id},data-color=${variant.colorName},data-color-hex=${variant.colorHex},data-image=${variant.imageUrl},data-price=${(product.discountPrice != null ? product.discountPrice : product.price) + (variant.additionalPrice != null ? variant.additionalPrice : 0)},aria-label=${variant.colorName}" th:title="${variant.colorName}"><span class="color-dot" th:style="'--swatch:' + (${variant.colorHex != null ? variant.colorHex : '#c8f169'})"></span><span class="variant-label" th:text="${variant.colorName}">Màu xe</span><span class="variant-stock" th:text="${variant.stockQuantity} + ' xe'">Còn hàng</span></button></div></section>
<div class="specs" th:if="${product.specification != null}"><div><small>TỐC ĐỘ TỐI ĐA</small><b th:text="${product.specification.maxSpeedKmh} + ' km/h'">—</b></div><div><small>QUÃNG ĐƯỜNG</small><b th:text="${product.specification.maxRangeKm} + ' km'">—</b></div><div><small>CÔNG SUẤT</small><b th:text="${product.specification.motorPowerWatts} + ' W'">—</b></div></div><div class="product-action product-detail-actions"><button id="buyNow" class="button">Mua xe <b>↗</b></button><button id="addFavorite" class="button ghost">♡ Yêu thích</button><button id="addCompare" class="button ghost">So sánh</button></div></div></div></main>
<footer><a class="brand" th:href="@{/}"><span>K</span> KINETIC</a><small>© 2026 KINETIC MOBILITY</small></footer>
<script>
const root=document.querySelector('#productPage');let selected=document.querySelector('.variant-option.selected');const item={id:Number(root.dataset.id),name:root.dataset.name,price:Number(root.dataset.price),slug:root.dataset.slug,image:root.dataset.image,quantity:1};
function pickVariant(button){document.querySelectorAll('.variant-option').forEach(x=>x.classList.remove('selected'));button.classList.add('selected');selected=button;document.querySelector('#selectedColor').textContent=button.dataset.color||'Màu xe';const image=button.dataset.image;if(image){document.querySelector('#productImage').src=image;item.image=image}const price=Number(button.dataset.price||item.price);document.querySelector('#productPrice').textContent=new Intl.NumberFormat('vi-VN').format(price)+' ₫';item.price=price;item.variantId=button.dataset.variantId;item.colorName=button.dataset.color}
document.querySelectorAll('.variant-option').forEach(button=>button.addEventListener('click',()=>pickVariant(button)));if(selected)pickVariant(selected);
document.querySelector('#buyNow').onclick=()=>{localStorage.setItem('kinetic_cart',JSON.stringify([item]));location.href='/checkout'};
document.querySelector('#addFavorite').onclick=async()=>{try{const r=await fetch('/api/v1/favorites',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId:item.id})});if(r.status===401){location.href='/login?returnTo='+encodeURIComponent(location.pathname);return}if(!r.ok)throw Error(await r.text());alert('Đã thêm xe vào danh sách yêu thích.')}catch(e){alert(e.message)}};
document.querySelector('#addCompare').onclick=()=>{let ids=[];try{ids=JSON.parse(localStorage.getItem('kinetic_compare')||'[]')}catch{}if(!ids.includes(item.id))ids.push(item.id);localStorage.setItem('kinetic_compare',JSON.stringify(ids.slice(0,4)));location.href='/compare'};
</script></body></html>
