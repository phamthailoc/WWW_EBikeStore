# Local-only defaults. The JWT key is random on every start (nothing guessable is stored in git), so everyone is signed out when the app restarts; set APP_JWT_SECRET to keep sessions.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123}
jwt.secret=${APP_JWT_SECRET:${random.uuid}${random.uuid}}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

logging.level.com.ebike=DEBUG
logging.level.org.springframework.jdbc=INFO
