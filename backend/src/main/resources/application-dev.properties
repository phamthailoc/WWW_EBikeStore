# Local-only defaults. Production (the prod profile) has none and must set these environment variables.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123}
jwt.secret=${APP_JWT_SECRET:dev-only-jwt-secret-do-not-use-in-production-0123456789}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

logging.level.com.ebike=DEBUG
logging.level.org.springframework.jdbc=INFO
